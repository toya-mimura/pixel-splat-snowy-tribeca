<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribeca Penthouse Splats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, nocturnal, a little magical
   IDEA: a snow-globe diorama on a dark desk; the page is the scene
   PICTURE: full-bleed point-splat penthouse, controls as a small pixel panel
   COLOUR and TYPE: night navy, snow white, one warm candle amber; DotGothic16
   LAYOUT: canvas fills the screen, title top-left, panel bottom-left, help bottom-right */
:root{color-scheme:dark;--bg:#070a16;--ink:#e8eef8;--dim:#a9bde0;--amber:#ffb347;--panel:rgba(10,14,30,.82);--line:#2d3b63}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:15px/1.5 "DotGothic16",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}
canvas:active{cursor:grabbing}
.ttl{position:fixed;left:16px;top:14px;pointer-events:none;text-shadow:0 2px 0 #000}
.ttl h1{margin:0;font-size:clamp(22px,3.4vw,34px);line-height:1.05;font-weight:400}
.ttl p{margin:6px 0 0;color:var(--dim);font-size:14px}
.pnl{position:fixed;left:12px;bottom:12px;width:min(330px,calc(100vw - 24px));background:var(--panel);border:2px solid var(--line);padding:10px 12px 12px;backdrop-filter:blur(4px)}
.pnl summary{cursor:pointer;color:var(--amber);font-size:15px;list-style:none;min-height:28px}
.pnl summary::-webkit-details-marker{display:none}
.pnl summary::before{content:"▸ ";}
.pnl[open] summary::before{content:"▾ ";}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
button{font:inherit;color:var(--ink);background:#141c33;border:2px solid var(--line);min-height:40px;padding:4px 8px;cursor:pointer}
button.on{background:#43578a;border-color:#a9bde0}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hint{margin:8px 0 4px;color:var(--dim);font-size:13px;min-height:3em}
.row{display:grid;grid-template-columns:auto 1fr 52px;gap:8px;align-items:center;margin-top:6px;font-size:14px}
.row output{text-align:right;color:var(--amber)}
input[type=range]{width:100%;accent-color:#ffb347;height:28px}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:14px}
.chk label{display:flex;align-items:center;gap:5px;min-height:30px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#ffb347}
.chk label.off{opacity:.4}
.xr{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.xr button{flex:1}
.stat{margin:8px 0 0;font-size:13px;color:#6a82b8}
.help{position:fixed;right:14px;bottom:12px;margin:0;color:#6a82b8;font-size:13px;text-align:right;pointer-events:none;max-width:46vw}
#load{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:var(--dim);background:var(--bg);text-align:center;padding:20px}
@media(max-width:600px){.help{display:none}.ttl p{font-size:13px}}
@media(prefers-reduced-motion:reduce){.pnl{backdrop-filter:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="ttl">
  <h1>Tribeca Penthouse</h1>
  <p>クリスマスイブのトライベッカ、屋上のペントハウス — ピクセルスプラット試作</p>
</header>
<details class="pnl" id="pnl" open>
  <summary>表示設定</summary>
  <div class="seg">
    <button id="mScreen" class="on" type="button">画面ドット</button>
    <button id="mWorld" type="button">空間ドット</button>
  </div>
  <p class="hint" id="hint"></p>
  <label class="row"><span>ドットの大きさ</span><input type="range" id="sz"><output id="szv"></output></label>
  <div class="chk">
    <label><input type="checkbox" id="q" checked>32色に減色</label>
    <label><input type="checkbox" id="d" checked>ディザ</label>
    <label id="crtw"><input type="checkbox" id="crt">CRT</label>
    <label><input type="checkbox" id="ar" checked>自動回転</label>
  </div>
  <div class="xr" id="xr"></div>
  <p class="stat" id="stat"></p>
</details>
<p class="help">ドラッグで回転 ・ ホイール／ピンチでズーム ・ ダブルクリックで視点リセット</p>
<div id="load">点群を生成しています…</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const loadEl=$('load');
function fail(m){loadEl.style.display='grid';loadEl.textContent=m;}
const cv=$('c');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,xrCompatible:true});
if(!gl){fail('WebGL2が使えないため表示できません。');return;}

/* ---------- utilities ---------- */
const R=(()=>{let a=20261224;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})();
const h2=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n);};
const hx=s=>[parseInt(s.slice(1,3),16)/255,parseInt(s.slice(3,5),16)/255,parseInt(s.slice(5,7),16)/255];
const J=(c,a)=>{const f=1+(R()-0.5)*a;return[c[0]*f,c[1]*f,c[2]*f];};
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const TAU=Math.PI*2;

/* ---------- point store ---------- */
const P=[],C=[],N=[],M=[];
const S=0.06;
function add(x,y,z,c,nx,ny,nz,o,s){
  if(o.fade!==false&&y<-2.6&&R()<(-2.6-y)/3.6)return;
  P.push(x,y,z);C.push(c[0],c[1],c[2]);N.push(nx,ny,nz);
  M.push(c.length>3?c[3]:(o.k||0),o.ph!=null?o.ph:R(),s,o.g||0);
}
function quad(ox,oy,oz,ux,uy,uz,vx,vy,vz,nx,ny,nz,col,o){
  o=o||{};const sp=o.sp||S,s=o.s||sp*1.25;
  const nu=Math.max(1,Math.round(Math.hypot(ux,uy,uz)/sp)),nv=Math.max(1,Math.round(Math.hypot(vx,vy,vz)/sp));
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
    const a=(i+0.5+(R()-0.5)*0.5)/nu,b=(j+0.5+(R()-0.5)*0.5)/nv;
    const x=ox+ux*a+vx*b,y=oy+uy*a+vy*b,z=oz+uz*a+vz*b;
    const c=typeof col==='function'?col(x,y,z,nx,ny,nz):col;
    if(c)add(x,y,z,c,nx,ny,nz,o,s);
  }
}
function box(x0,y0,z0,x1,y1,z1,col,o){
  o=o||{};const sk=o.skip!=null?o.skip:'b';const dx=x1-x0,dy=y1-y0,dz=z1-z0;
  if(!sk.includes('t'))quad(x0,y1,z0,dx,0,0,0,0,dz,0,1,0,col,o);
  if(!sk.includes('b'))quad(x0,y0,z0,dx,0,0,0,0,dz,0,-1,0,col,o);
  if(!sk.includes('x'))quad(x0,y0,z0,0,dy,0,0,0,dz,-1,0,0,col,o);
  if(!sk.includes('X'))quad(x1,y0,z0,0,dy,0,0,0,dz,1,0,0,col,o);
  if(!sk.includes('z'))quad(x0,y0,z0,dx,0,0,0,dy,0,0,0,-1,col,o);
  if(!sk.includes('Z'))quad(x0,y0,z1,dx,0,0,0,dy,0,0,0,1,col,o);
}
function disc(cx,y,cz,r,col,o,ny){
  o=o||{};const sp=o.sp||S,s=o.s||sp*1.25;const nr=Math.max(1,Math.round(r/sp));
  for(let ir=0;ir<nr;ir++){const rr=(ir+0.5)/nr*r;const na=Math.max(1,Math.round(TAU*rr/sp));
    for(let ia=0;ia<na;ia++){const a=(ia+R()*0.5)/na*TAU;const x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr;
      const c=typeof col==='function'?col(x,y,z,0,ny||1,0):col;if(c)add(x,y,z,c,0,ny||1,0,o,s);}}
}
function cyl(cx,cz,y0,y1,r0,r1,col,o){
  o=o||{};const sp=o.sp||S,s=o.s||sp*1.25;const h=y1-y0,rm=Math.max(r0,r1);
  const na=Math.max(6,Math.round(TAU*rm/sp)),nh=Math.max(1,Math.round(Math.hypot(h,r1-r0)/sp));
  const sl=(r0-r1)/h;
  for(let j=0;j<nh;j++){const t=(j+0.5)/nh;const r=r0+(r1-r0)*t;if(r<0.004)continue;
    const nn=Math.max(4,Math.round(na*r/rm));
    for(let i=0;i<nn;i++){const a=(i+R()*0.5)/nn*TAU;const ca=Math.cos(a),sa=Math.sin(a);const l=Math.hypot(1,sl);
      const x=cx+ca*r,y=y0+h*t,z=cz+sa*r;const c=typeof col==='function'?col(x,y,z,ca/l,sl/l,sa/l):col;
      if(c)add(x,y,z,c,ca/l,sl/l,sa/l,o,s);}}
  if(o.top)disc(cx,y1,cz,r1,col,o,1);
}
function sphere(cx,cy,cz,r,col,o){
  o=o||{};const sp=o.sp||S,s=o.s||sp*1.25;const n=Math.max(8,Math.round(4*Math.PI*r*r/(sp*sp)));
  for(let i=0;i<n;i++){const y=1-2*(i+0.5)/n,rr=Math.sqrt(1-y*y),a=i*2.39996;const nx=Math.cos(a)*rr,nz=Math.sin(a)*rr;
    const x=cx+nx*r,yy=cy+y*r,z=cz+nz*r;const c=typeof col==='function'?col(x,yy,z,nx,y,nz):col;if(c)add(x,yy,z,c,nx,y,nz,o,s);}
}
function line(a,b,col,o,step){
  o=o||{};const L=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);const n=Math.max(1,Math.ceil(L/step));
  for(let i=0;i<=n;i++){const t=i/n;add(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,col,0,1,0,o,o.s||step*1.3);}
}

/* ---------- materials ---------- */
const BR=['#7a3426','#8e3f2b','#6b2e22','#9a4a33','#5e2a20'].map(hx);
const MORTAR=[0.45,0.41,0.37],SNOW=[0.86,0.9,0.97],STEEL=[0.06,0.065,0.075],SECT=[0.13,0.11,0.11],
SOOT=[0.06,0.05,0.05],WALNUT=[0.3,0.17,0.09],MARBLE=[0.86,0.84,0.8],STONE=[0.42,0.4,0.38],CREAM=[0.9,0.84,0.72],
VELVET=[0.09,0.3,0.19],COGNAC=[0.5,0.26,0.12],IRON=[0.17,0.21,0.19],BRASS=[0.7,0.52,0.24],TERRA=[0.62,0.32,0.2];
function brickC(u,v){const bh=0.076,bw=0.23;const row=Math.floor(v/bh);const uu=u+(row&1)*bw*0.5;const col=Math.floor(uu/bw);
  const fu=uu/bw-col,fv=v/bh-row;if(fu<0.1||fv<0.16)return J(MORTAR,0.1);return J(BR[Math.floor(h2(row,col)*BR.length)],0.12);}
const inRoom=(x,z)=>x>-8.5&&x<1.5&&z>-8.5&&z<0.5;
const wallC=(x,y,z,nx,ny)=>ny>0.5?SECT:brickC(Math.abs(nx)>0.5?z:x,y);

/* footprints from the terrace door to the snowman */
const FP=[];{const px=0.98,pz=-0.196;for(let i=0;i<28;i++){const t=i/27;const x=1.95+2.0*t+Math.sin(t*3)*0.6,z=-3.6+9.9*t;const sd=(i%2?1:-1)*0.13;FP.push([x+px*sd,z+pz*sd]);}}
function snowC(x,z){for(const f of FP){const dx=x-f[0],dz=z-f[1];if(dx*dx/0.008+dz*dz/0.02<1)return[0.55,0.62,0.78];}
  if(R()<0.012)return[1.5,1.55,1.7];return J(SNOW,0.06);}
function parquet(x,z){const pw=0.16;const row=Math.floor(z/pw);const off=h2(row,3)*1.2;const pl=Math.floor((x+off)/1.1);
  const fx=(x+off)/1.1-pl,fz=z/pw-row;if(fz<0.1||fx<0.02)return[0.2,0.12,0.07];return J(mixc([0.52,0.33,0.18],[0.4,0.24,0.12],h2(row,pl)),0.06);}

/* ---------- the building ---------- */
function buildScene(){
  // roof surface: parquet inside, snow outside
  quad(-9,0,-9,18,0,0,0,0,18,0,1,0,(x,y,z)=>inRoom(x,z)?parquet(x,z):snowC(x,z));
  // facade with lit windows
  const facadeC=(x,y,z,nx)=>{const u=Math.abs(nx)>0.5?z:x;
    const fl=Math.floor(-y/1.7),fy=-y/1.7-fl,cu=Math.floor((u+9)/1.5),fu=(u+9)/1.5-cu;
    if(fy>0.25&&fy<0.85&&fu>0.22&&fu<0.78){const hh=h2(fl*7+cu,nx*3+(Math.abs(nx)>0.5?0:Math.sign(z))*5+11);
      if(hh<0.42)return[0.95*(0.7+hh),0.66*(0.7+hh),0.38*(0.7+hh),1];
      if(hh<0.48){const cc=[[2,0.35,0.25],[0.35,1.7,0.45],[2,1.5,0.6]][Math.floor(R()*3)];return[cc[0],cc[1],cc[2],2];}
      return[0.05,0.06,0.09];}
    if(fu>0.18&&fu<0.82&&((fy>0.18&&fy<0.25)||(fy>0.85&&fy<0.9)))return J([0.58,0.53,0.47],0.05);
    return brickC(u,y);};
  box(-9,-6,-9,9,0,9,facadeC,{skip:'tb',sp:0.07});
  // cast-iron cornice strips with snow on the ledge
  const corC=(x,y,z,nx,ny)=>ny>0.5?J(SNOW,0.05):J([0.2,0.23,0.21],0.08);
  box(-9.18,-0.5,-9.18,9.18,-0.22,-9,corC);box(-9.18,-0.5,9,9.18,-0.22,9.18,corC);
  box(-9.18,-0.5,-9,-9,-0.22,9,corC);box(9,-0.5,-9,9.18,-0.22,9,corC);
  // parapet with snow caps
  const parC=(x,y,z,nx,ny)=>ny>0.5?J(SNOW,0.05):brickC(Math.abs(nx)>0.5?z:x,y);
  box(-9,0,-9,9,0.85,-8.7,parC);box(-9,0,8.7,9,0.85,9,parC);box(-9,0,-8.7,-8.7,0.85,8.7,parC);box(8.7,0,-8.7,9,0.85,8.7,parC);

  /* ---- penthouse walls ---- */
  box(-8.5,0,-8.5,-8.2,4.2,0.5,wallC,{g:1});
  box(-8.2,0,0.2,1.2,4.2,0.5,wallC,{g:4});
  windowWall('x',-8.5,1.5,-8.5,-8.2,2,null,true);
  windowWall('z',-8.2,0.2,1.2,1.5,3,[-4.45,-3.05],false);

  /* ---- fireplace ---- */
  box(-8.2,0,-5.2,-7.6,4.2,-2.8,(x,y,z,nx,ny)=>{if(ny>0.5)return SECT;if(nx>0.5&&z>-4.6&&z<-3.4&&y<1.0)return null;return brickC(Math.abs(nx)>0.5?z:x,y);},{g:1});
  box(-7.62,0,-4.85,-7.53,1.15,-4.6,MARBLE,{g:1});box(-7.62,0,-3.4,-7.53,1.15,-3.15,MARBLE,{g:1});box(-7.62,1.0,-4.85,-7.53,1.15,-3.15,MARBLE,{g:1});
  quad(-8.12,0,-4.6,0,1.0,0,0,0,1.2,1,0,0,SOOT,{g:1});
  quad(-8.12,0,-4.6,0.52,0,0,0,1.0,0,0,0,1,SOOT,{g:1});
  quad(-8.12,0,-3.4,0.52,0,0,0,1.0,0,0,0,-1,SOOT,{g:1});
  quad(-8.12,1.0,-4.6,0.52,0,0,0,0,1.2,0,-1,0,SOOT,{g:1});
  quad(-8.12,0.012,-4.6,0.52,0,0,0,0,1.2,0,1,0,[0.12,0.1,0.09],{g:1});
  box(-7.6,0,-5.0,-6.9,0.05,-3.0,(x,y,z)=>J(STONE,0.1));
  box(-8.0,0.02,-4.35,-7.72,0.16,-3.65,[0.25,0.14,0.07],{g:1});box(-7.98,0.14,-4.2,-7.8,0.26,-3.8,[0.3,0.17,0.08],{g:1});
  for(let i=0;i<800;i++){const r=R();const c=r<0.35?[2.4,1.7,0.6,3]:r<0.75?[2.2,0.9,0.25,3]:[1.5,0.4,0.1,3];
    add(-7.98+R()*0.26,0.2+R()*0.12,-4.3+R()*0.6,c,0,1,0,{g:1},0.06);}
  for(let i=0;i<200;i++)add(-8.0+R()*0.28,0.16+R()*0.1,-4.35+R()*0.7,[1.4,0.35,0.08,2],0,1,0,{g:1},0.035);
  // mantel, garland, stockings, wreath
  box(-7.68,1.15,-5.35,-7.3,1.3,-2.65,WALNUT,{g:1,skip:''});
  for(let i=0;i<1100;i++)add(-7.42+R()*0.2,1.3+R()*0.13,-5.3+R()*2.6,J([0.1,0.3,0.14],0.5),1,0.3,0,{g:1},0.05);
  for(const ez of[-5.3,-2.7])for(let i=0;i<200;i++){const t=R();add(-7.3+R()*0.06,1.3-t*0.7,ez+(R()-0.5)*0.1,J([0.1,0.3,0.14],0.5),1,0,0,{g:1},0.05);}
  for(let i=0;i<60;i++)add(-7.3,1.32+R()*0.1,-5.3+R()*2.6,[0.7,0.08,0.06],1,0,0,{g:1},0.035);
  for(let i=0;i<30;i++)add(-7.29,1.33+R()*0.08,-5.3+i*2.6/29,[1.9,1.35,0.7,2],1,0,0,{g:1},0.045);
  [[-4.55,[0.62,0.08,0.07]],[-4.0,[0.1,0.32,0.16]],[-3.45,[0.62,0.08,0.07]]].forEach(([z,c])=>{
    box(-7.38,0.72,z-0.07,-7.3,1.08,z+0.07,c,{g:1,skip:''});box(-7.38,0.72,z+0.07,-7.3,0.84,z+0.17,c,{g:1,skip:''});
    box(-7.39,1.04,z-0.08,-7.29,1.15,z+0.08,[0.92,0.9,0.86],{g:1,skip:''});});
  for(let i=0;i<1500;i++){const u=R()*TAU,v=R()*TAU;const rr=0.36+0.1*Math.cos(v);
    add(-7.56+0.1*Math.abs(Math.sin(v)),2.55+rr*Math.sin(u),-4.0+rr*Math.cos(u),J([0.08,0.28,0.12],0.5),1,0,0,{g:1},0.05);}
  for(let i=0;i<40;i++){const u=R()*TAU;add(-7.47,2.55+0.4*Math.sin(u),-4.0+0.4*Math.cos(u),[0.75,0.08,0.06],1,0,0,{g:1},0.04);}
  box(-7.52,2.08,-4.12,-7.46,2.26,-3.88,[0.7,0.07,0.06],{g:1,skip:''});
  // chimney stack and smoke
  box(-8.7,4.2,-4.7,-7.8,5.3,-3.3,(x,y,z,nx,ny)=>ny>0.5?J(SNOW,0.05):brickC(Math.abs(nx)>0.5?z:x,y),{g:1});
  for(let i=0;i<260;i++)add(-8.25+(R()-0.5)*0.5,5.35,-4.0+(R()-0.5)*0.8,[0.32,0.34,0.42,6],0,1,0,{fade:false},0.12);

  /* ---- living room ---- */
  quad(-6.9,0.02,-6.0,3.0,0,0,0,0,4.0,0,1,0,(x,y,z)=>{const u=Math.min(x+6.9,-3.9-x),v=Math.min(z+6.0,-2.0-z),e=Math.min(u,v);
    if(e<0.12)return J([0.62,0.45,0.18],0.08);if(e<0.2)return[0.1,0.12,0.25];if(e<0.32)return J([0.55,0.1,0.09],0.06);
    const dd=Math.abs(x+5.4)+Math.abs(z+4.0)*0.75;if(Math.abs(dd-0.9)<0.06||dd<0.25)return[0.62,0.45,0.18];return J([0.45,0.07,0.08],0.06);});
  // sofa facing the fire

function drawPts(mvp,cam,pxs,world,t){gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.useProgram(pp.p);const u=pp.u;
  gl.uniformMatrix4fv(u.uMVP,false,mvp);gl.uniform3f(u.uCam,cam[0],cam[1],cam[2]);gl.uniform1f(u.uT,t);gl.uniform1f(u.uPx,pxs);
  gl.uniform1f(u.uMinPx,1.0);gl.uniform1f(u.uSnowMax,world?Math.max(3,pxs*0.004):2.5);gl.uniform1f(u.uG,st.g);gl.uniform1i(u.uWorld,world?1:0);
  gl.uniform1i(u.uQ,world&&st.q?1:0);gl.uniform1f(u.uDA,st.d?0.07:0.0);gl.bindVertexArray(vao);gl.drawArrays(gl.POINTS,0,NP);}

let fps=60,prevT=0,xrSession=null;
function frame(ts){
  if(xrSession)return;requestAnimationFrame(frame);
  const t=ts/1000,dt=Math.min(0.1,t-(prevT||t));prevT=t;if(dt>0)fps=fps*0.95+0.05/dt;
  resize();if(st.auto&&ptrs.size===0)yaw+=dt*0.05;
  const cp=Math.cos(pitch);const eye=[tgt[0]+dist*Math.sin(yaw)*cp,tgt[1]+dist*Math.sin(pitch),tgt[2]+dist*Math.cos(yaw)*cp];
  const Pm=persp(0.62,W/H,0.5,400),mvp=mul(Pm,lookAt(eye,tgt,[0,1,0]));
  if(st.mode==='screen'){const dpr=W/Math.max(1,cv.clientWidth);const lw=Math.max(1,Math.round(W/(st.px*dpr))),lh=Math.max(1,Math.round(H/(st.px*dpr)));
    ensureFBO(lw,lh);gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,lw,lh);gl.clear(gl.DEPTH_BUFFER_BIT);drawFS(bgp);
    drawPts(mvp,eye,Pm[5]*lh/2,false,t);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(blp.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ftex);
    gl.uniform1i(blp.u.uTex,0);gl.uniform2f(blp.u.uLow,lw,lh);gl.uniform1i(blp.u.uQ,st.q?1:0);gl.uniform1i(blp.u.uCRT,st.crt?1:0);gl.uniform1f(blp.u.uDA,st.d?0.09:0.0);
    drawFS(blp);}
  else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.clear(gl.DEPTH_BUFFER_BIT);drawFS(bgp);drawPts(mvp,eye,Pm[5]*H/2,true,t);}
  if(Math.floor(t*2)!==Math.floor((t-dt)*2))$('stat').textContent=`${(NP/10000).toFixed(1)}万点 ・ ${Math.round(fps)} fps`;
}

/* ---------- WebXR ---------- */
let xrRef=null,xrFloor=true,xrAR=false;
const XS=0.028;
async function startXR(mode){
  try{const s=await navigator.xr.requestSession(mode,{optionalFeatures:['local-floor']});await gl.makeXRCompatible();
    s.updateRenderState({baseLayer:new XRWebGLLayer(s,gl,{antialias:false})});
    try{xrRef=await s.requestReferenceSpace('local-floor');xrFloor=true;}catch(e){xrRef=await s.requestReferenceSpace('local');xrFloor=false;}
    xrSession=s;xrAR=mode==='immersive-ar';const prevMode=st.mode;st.mode='world';syncUI();
    s.addEventListener('end',()=>{xrSession=null;st.mode=prevMode;syncUI();requestAnimationFrame(frame);});
    s.requestAnimationFrame(xrFrame);
  }catch(e){$('xr').insertAdjacentHTML('beforeend','<span>XRを開始できませんでした</span>');}
}
function xrFrame(ts,fr){const s=fr.session;s.requestAnimationFrame(xrFrame);const pose=fr.getViewerPose(xrRef);if(!pose)return;
  const L=s.renderState.baseLayer;gl.bindFramebuffer(gl.FRAMEBUFFER,L.framebuffer);gl.clearColor(0,0,0,xrAR?0:1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const T=[0,xrFloor?0.95:-0.3,-0.75];const Mm=new Float32Array([XS,0,0,0,0,XS,0,0,0,0,XS,0,T[0],T[1],T[2],1]);const t=ts/1000;
  for(const v of pose.views){const vp=L.getViewport(v);gl.viewport(vp.x,vp.y,vp.width,vp.height);if(!xrAR)drawFS(bgp);
    const mvp=mul(mul(v.projectionMatrix,v.transform.inverse.matrix),Mm);const p=v.transform.position;
    drawPts(mvp,[(p.x-T[0])/XS,(p.y-T[1])/XS,(p.z-T[2])/XS],v.projectionMatrix[5]*vp.height/2,true,t);}}
(async()=>{const box=$('xr');let any=false;
  if(navigator.xr){for(const[m,l]of[['immersive-vr','VRで見る'],['immersive-ar','ARで机に置く']]){
    try{if(await navigator.xr.isSessionSupported(m)){const b=document.createElement('button');b.type='button';b.textContent=l;b.onclick=()=>startXR(m);box.appendChild(b);any=true;}}catch(e){}}}
  if(!any)box.textContent='WebXR未対応の環境です（Quest Browserなどで直接開くとVR／ARボタンが出ます）';})();

/* ---------- go ---------- */
setTimeout(()=>{try{
  buildScene();buildCity();buildSnow();const d=bake();upload(d);
  gl.clearColor(0,0,0,1);loadEl.style.display='none';requestAnimationFrame(frame);
}catch(e){fail('エラー: '+e.message);console.error(e);}},40);
})();
